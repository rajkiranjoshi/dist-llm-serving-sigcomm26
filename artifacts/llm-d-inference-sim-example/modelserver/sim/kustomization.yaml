apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - plain-service.yaml

namePrefix: sim-

images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: ghcr.io/llm-d/llm-d-inference-sim
    # v0.9.2 is the floor: --force-dummy-tokenizer does not exist in v0.9.0 or
    # earlier, and without it a real HF model name makes the simulator require a
    # separate tokenizer render service. Verified against `--help` in both tags.
    newTag: v0.9.2

# `llm-d.ai/guide` is the join key: router/minikube.values.yaml sets
# router.modelServers.matchLabels to this exact pair, which is how the
# InferencePool finds these pods.
labels:
  - pairs:
      llm-d.ai/guide: optimized-baseline-sim
      llm-d.ai/model: Qwen3-32B
      llm-d.ai/inference-engine: llm-d-inference-sim
    includeSelectors: true
    includeTemplates: true

patches:
  - path: patch-sim.yaml
